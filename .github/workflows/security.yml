# Fleet supply-chain CI (SuiteControl/templates/ci). Copy to
# .github/workflows/security.yml -- see templates/ci/README.md.
#
# - gitleaks over the full git history on every push and PR.
# - pip-audit for Python dependencies (requirements*.txt), when present.
# - npm audit for Node dependencies (package-lock.json), when present;
#   fails on high/critical.
#
# Rules (docs/free-tools/PLAN.md in local-ai-infrastructure):
# - First-party actions/* only, each pinned by full commit SHA (tag in the
#   comment). Never pin by tag: tags can be re-pointed (CVE-2026-33634).
# - Tools are built or installed from source with integrity checks:
#   gitleaks via `go install` (Go checksum database), pip-audit via
#   `pip install --require-hashes`.
# - Read-only token; checkout doesn't keep credentials.
name: security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: a secret removed later is still exposed
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Build gitleaks v8.30.1 from source
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan the full history
        run: |
          config=()
          [ -f .gitleaks.toml ] && config=(--config .gitleaks.toml)
          # --log-opts=HEAD: only the history of the commit under test. The
          # default (--all) would fail every branch for a leak on any one.
          "$(go env GOPATH)/bin/gitleaks" git --redact --verbose --log-opts="HEAD" "${config[@]}" .

  # hashFiles() isn't allowed in a job-level `if:`, so each job always runs
  # and its steps are skipped when the repo has no files of that kind.
  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: hashFiles('**/requirements*.txt') != ''
        with:
          python-version: "3.12"
      - name: Install pip-audit 2.10.1 (hash-locked)
        if: hashFiles('**/requirements*.txt') != ''
        run: pip install --require-hashes -r .github/security/requirements-audit.txt
      - name: Audit every requirements file
        if: hashFiles('**/requirements*.txt') != ''
        run: |
          status=0
          while IFS= read -r req; do
            echo "::group::pip-audit -r $req"
            pip-audit --progress-spinner off -r "$req" || status=1
            echo "::endgroup::"
          done < <(git ls-files '*requirements*.txt' ':!:.github/security/*')
          exit $status

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: hashFiles('**/package-lock.json') != ''
        with:
          node-version: "22"
      - name: npm audit (fails on high or critical)
        if: hashFiles('**/package-lock.json') != ''
        run: |
          status=0
          while IFS= read -r lock; do
            dir=$(dirname "$lock")
            echo "::group::npm audit in $dir"
            (cd "$dir" && npm audit --audit-level=high) || status=1
            echo "::endgroup::"
          done < <(git ls-files '*package-lock.json' ':!:**/node_modules/**')
          exit $status
