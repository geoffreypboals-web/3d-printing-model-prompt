# Project: 3D Printing Model Prompt
# File: /home/user/3d-printing-model-prompt/.github/workflows/ci.yml
# Description: CI pipeline (CLAUDE.md rule 15) - lints, tests, and builds
#     the Docker image on every push/PR. All CAD/LLM calls in the test
#     suite are mocked, so this needs neither OpenSCAD/Blender nor a
#     running LLM.
# Troubleshooting:
#     - A red "lint" job means `ruff check` or `black --check` failed -
#       run both locally (see README.md) and push the fix.
#     - A red "docker-build" job with the rest green usually means the
#       Dockerfile's apt package list is stale - see TROUBLESHOOTING.md.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Format check (black)
        run: black --check src tests

      - name: Test
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t threedprompt:ci .
